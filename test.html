<!doctype html>
<meta charset="utf-8">
<title>dark-any self-check</title>
<h1>dark-any self-check</h1>
<p>Open this file in a browser. It fails loudly if anything below breaks.</p>
<pre id="out">running…</pre>
<div id="probe" style="background:#ffffff">probe</div>

<!-- the popup's markup, so popup.js has the elements it paints -->
<div id="popup-fixture" hidden>
  <button id="cursor" aria-pressed="false">Activate cursor <span class="keys"></span></button>
  <button id="dark" aria-pressed="false">Activate dark theme <span class="keys"></span></button>
  <p id="err" hidden></p>
</div>

<script src="dark.js"></script>
<script src="cursor.js"></script>
<!-- Loaded a SECOND time on purpose: this is what the worker's injection does to a
     page that already has the content scripts. It used to produce two cursors. -->
<script src="dark.js"></script>
<script src="cursor.js"></script>
<script src="popup.js"></script>

<script>
const fails = [];
const ok = (cond, what) => { if (!cond) fails.push(what); };
// a thrown check must not leave the page stuck on "running…"
addEventListener('error', e => {
  out.textContent = 'ERROR\n' + (e.error?.stack || e.message);
  out.style.color = 'crimson';
});
const near = (a, b, slack = 0.001) => Math.abs(a - b) <= slack;
const kc = darkAnyCursor;

// --- light/dark detection ---
const isDark = c => darkAny.luminanceOf(c) < darkAny.DARK_BELOW;

ok(!isDark('rgb(255, 255, 255)'), 'white must read as light');
ok(!isDark('rgb(246, 246, 246)'), 'near-white must read as light');
ok(isDark('rgb(22, 24, 28)'), 'near-black must read as dark');
ok(isDark('rgb(0, 0, 0)'), 'black must read as dark');
ok(!isDark('rgba(0, 0, 0, 0)'), 'transparent = browser default white, so light');
ok(!isDark('transparent'), 'the transparent keyword must fall back to light');
ok(isDark('rgb(0, 0, 139)'), 'dark blue must read as dark');
ok(!isDark('rgb(255, 255, 0)'), 'yellow is bright, must read as light');

// the CSS must un-flip media, or every image on every page comes out negative
ok(/\bimg\b/.test(darkAny.CSS) && /\bvideo\b/.test(darkAny.CSS), 'CSS must re-invert img and video');
ok(darkAny.CSS.includes('#dark-any-cursor'), 'dark CSS must un-flip the cursor overlay');

ok(typeof darkAny.pageIsDark() === 'boolean', 'pageIsDark must return a boolean');
ok(darkAny.pageIsDark() === false, 'this page is white, so pageIsDark must be false');

// --- what to do on a given page: pref, pdf, dark ---
const d = darkAny.decide;
ok(d(undefined, false, false) === 'on', 'a plain white page must go dark');
ok(d(undefined, false, true) === 'off', 'a page that already ships dark must be left alone');
// The PDF viewer's wrapper body is the viewer's dark grey chrome, so the luminance check
// says "already dark" while the paper itself is white. PDFs must override that.
ok(d(undefined, true, true) === 'on', 'a PDF must be darkened despite its dark grey chrome');
ok(d(undefined, true, false) === 'on', 'a PDF must be darkened either way');
ok(d('off', true, false) === 'off', 'turning a PDF off by hand must still win');
ok(d('on', false, true) === 'on', 'forcing a dark site on must still win');
ok(typeof darkAny.isPdfViewer() === 'boolean', 'the PDF check must return a boolean');
ok(darkAny.isPdfViewer() === false, 'this page is HTML, so it is not the PDF viewer');

// an embedded PDF must flip with the page instead of being protected as media
ok(/embed\[type="application\/pdf"\][^}]*filter:\s*none/.test(darkAny.CSS.replace(/\s+/g, ' ')),
   'CSS must let an embedded PDF inherit the flip');

// --- cursor speed ramp ---
ok(kc.speedAt(0, false) === kc.V0, 'a fresh keypress starts at V0, not from a standstill');
ok(kc.speedAt(100, false) > kc.speedAt(0, false), 'holding the key must accelerate');
ok(kc.speedAt(10_000, false) === kc.VMAX, 'speed must cap at VMAX, not run away');
ok(kc.speedAt(0, true) === kc.V0 * kc.FAST, 'Shift must multiply the speed');
ok(kc.speedAt(10_000, true) === kc.VMAX * kc.FAST, 'Shift still applies at the ceiling');
ok(kc.speedAt(-50, false) === kc.V0, 'a negative clock delta must not go backwards');

// --- cursor movement, clamping and scroll handover ---
const VW = 800, VH = 600;
const at = (x, y) => ({ x, y });

let m = kc.advance(at(400, 300), { x: 1, y: 0 }, 50, VW, VH);
ok(near(m.x, 450) && near(m.y, 300), 'moving right adds distance to x only');
ok(!m.scroll.dx && !m.scroll.dy, 'a move inside the viewport must not scroll');

m = kc.advance(at(400, 300), { x: 0, y: -1 }, 50, VW, VH);
ok(near(m.y, 250), 'moving up decreases y');

// normalised, or diagonals would travel 1.41x faster than straight lines
m = kc.advance(at(400, 300), { x: 1, y: 1 }, 100, VW, VH);
ok(near(Math.hypot(m.x - 400, m.y - 300), 100, 0.01), 'a diagonal must cover the same distance');
ok(near(m.x - 400, m.y - 300), 'a 45-degree diagonal must move both axes equally');

m = kc.advance(at(VW - 2, 300), { x: 1, y: 0 }, 50, VW, VH);
ok(m.x === VW - 1, 'the cursor must clamp to the edge, never leave the viewport');
ok(near(m.scroll.dx, 49), 'the overshoot becomes scroll, so nothing is out of reach');

m = kc.advance(at(5, 5), { x: 0, y: -1 }, 30, VW, VH);
ok(m.y === 0 && near(m.scroll.dy, -25), 'at the top it clamps to 0 and scrolls up');

// two keys at once must combine, one key must not be diagonal
ok(kc.dirOf(new Set(['ArrowRight', 'ArrowDown'])).x === 1, 'holding two arrows must combine them');
ok(kc.dirOf(new Set(['ArrowRight', 'ArrowDown'])).y === 1, 'the second axis must register too');
ok(kc.dirOf(new Set(['ArrowLeft', 'ArrowRight'])).x === 0, 'opposite arrows must cancel out');

// --- cursor lifecycle ---
kc.cursorOn();
ok(!!document.getElementById(kc.CURSOR_ID), 'cursorOn must draw the cursor');
kc.cursorOn();
ok(document.querySelectorAll('#' + kc.CURSOR_ID).length === 1, 'cursorOn twice must not stack two cursors');

// Both scripts were loaded twice above. If a second copy can run alongside the first,
// each keeps its own cursor and the page ends up with two rings.
const strays = document.querySelectorAll('#' + kc.CURSOR_ID).length;
ok(strays === 1, `a double injection must leave exactly one cursor, found ${strays}`);

// ...and prove the second execution actually completed. At top level it died on a
// redeclaration instead, which is what made the two copies fight in the first place.
ok(globalThis.__darkAnyCursorLoads === 2,
   `cursor.js must survive being run twice (completed runs: ${globalThis.__darkAnyCursorLoads})`);
ok(globalThis.__darkAnyLoads === 2,
   `dark.js must survive being run twice (completed runs: ${globalThis.__darkAnyLoads})`);
ok(document.querySelectorAll('style#dark-any').length <= 1, 'a double run must not stack two stylesheets');

// and a ring abandoned by an orphaned copy must be swept, not added to
kc.cursorOff();
const ghost = document.createElement('div');
ghost.id = kc.CURSOR_ID;
document.body.append(ghost);
kc.cursorOn();
ok(document.querySelectorAll('#' + kc.CURSOR_ID).length === 1,
   'an abandoned ring must be cleared away, not joined by a second one');

kc.cursorOff();
ok(!document.getElementById(kc.CURSOR_ID), 'cursorOff must remove the cursor');
kc.cursorOff(); // must not throw on a second call

// --- popup buttons ---
const p = darkAnyPopup;
const cursorBtn = p.BUTTONS.find(b => b.id === 'cursor');
const darkBtn = p.BUTTONS.find(b => b.id === 'dark');

p.paint(cursorBtn, false);
ok(document.getElementById('cursor').textContent.startsWith('Activate cursor'),
   'an off cursor must offer to activate it');
p.paint(cursorBtn, true);
ok(document.getElementById('cursor').textContent.startsWith('Deactivate cursor'),
   'an on cursor must offer to deactivate it');
ok(document.getElementById('cursor').getAttribute('aria-pressed') === 'true',
   'the button must report its state to screen readers');
p.paint(darkBtn, false);
ok(document.getElementById('dark').textContent.startsWith('Activate dark theme'),
   'the dark button must name the dark theme');
ok(!!document.querySelector('#cursor .keys'), 'repainting must not wipe the shortcut hint');

ok(p.errText('Cannot access contents of url "chrome://extensions"').includes('browser pages'),
   'a browser-page failure must be explained, not dumped raw');
ok(p.errText('no active tab') === 'no active tab', 'an unknown error must pass through unchanged');
p.fail('no active tab');
ok(!document.getElementById('err').hidden, 'fail() must reveal the error line');

// Regression: the labels once waited on a message round trip, so when the worker
// could not resolve the tab both buttons sat there saying nothing at all.
document.getElementById('cursor').firstChild.textContent = '…';
document.getElementById('dark').firstChild.textContent = '…';
globalThis.chrome = {                        // messages that never answer
  runtime: { sendMessage: () => new Promise(() => {}) },
  tabs: { query: () => new Promise(() => {}) },
  commands: { getAll: () => new Promise(() => {}) },
};
p.wire();
ok(document.getElementById('cursor').textContent.trim().startsWith('Activate cursor'),
   'the cursor label must be readable without any answer from the page');
ok(document.getElementById('dark').textContent.trim().startsWith('Activate dark theme'),
   'the dark label must be readable without any answer from the page');
delete globalThis.chrome;

// --- the real key loop, driven through actual events ---
const xOf = () => darkAnyCursor.posOf().x;  // logical position, free of any draw offset
const isTypingNow = () => {
  const a = document.activeElement;
  return !!a && (a.isContentEditable || /^(input|textarea|select)$/i.test(a.tagName));
};

// Timestamps are injected rather than waiting on requestAnimationFrame: the display
// may throttle frames to nothing in a background tab, and that must not read as a bug.
const noViewport = !innerWidth || !innerHeight;

(() => {
  // A hidden or headless tab reports a 0x0 viewport, where every hit test returns null.
  // Say so loudly instead of reporting a wall of failures that look like real bugs.
  if (noViewport) return;

  // Target the top-left of the viewport: always visible, whatever the window size.
  // Then place() the cursor on it, rather than assuming where the spawn point lands.
  scrollTo(0, 0);
  const btn = document.createElement('button');
  btn.textContent = 'target';
  btn.style.cssText = `position:absolute;left:${scrollX}px;top:${scrollY}px;width:200px;height:60px`;
  let clicks = 0;
  btn.onclick = () => clicks++;
  const inp = document.createElement('input');
  document.body.append(btn, inp);

  const down = (k, shift) => dispatchEvent(
    new KeyboardEvent('keydown', { key: k, shiftKey: !!shift, bubbles: true, cancelable: true }));
  const up = k => dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true }));

  kc.cursorOn();
  const dot = document.getElementById(kc.CURSOR_ID);
  const spawn = el => {
    el.style.position = 'absolute';
    el.style.left = scrollX + 'px';
    el.style.top = scrollY + 'px';
    el.style.zIndex = '99999';
    document.body.append(el);
    return el;
  };
  const centre = el => {
    const r = el.getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
  };
  const aimAt = el => { const c = centre(el); kc.place(c.x, c.y); return c; };
  let c = aimAt(btn);
  ok(document.elementFromPoint(c.x, c.y) === btn, 'test setup: the target must sit under the cursor');

  down('Enter');
  ok(clicks === 1, 'Enter must click whatever sits under the cursor');

  // THE regression: a page with a focused search box made Enter do nothing anywhere,
  // because the decision looked at what was focused instead of what was under the ring.
  // The target must be NON-focusable — a plain div, like most clickable site UI.
  // A <button> would take focus and mask the bug by clearing the typing state.
  const plain = document.createElement('div');
  plain.textContent = 'plain clickable';
  plain.style.cssText = 'width:160px;height:40px';
  let plainClicks = 0;
  plain.addEventListener('click', () => plainClicks++);
  spawn(plain);

  inp.focus();
  ok(isTypingNow(), 'setup: a text field must really hold focus here');
  c = aimAt(plain);
  ok(document.elementFromPoint(c.x, c.y) === plain, 'setup: the plain div must sit under the cursor');
  // through a REAL key event, so this covers the keydown guard that swallowed Enter
  // outright whenever a page had autofocused a search box
  down('Enter');
  ok(plainClicks === 1,
     'Enter must click a plain element even while a text field elsewhere holds focus');
  inp.blur();

  // ...but a text field UNDER the cursor keeps Enter, so forms still submit
  const formField = document.createElement('input');
  formField.style.cssText = 'width:160px;height:30px';
  spawn(formField);
  formField.focus();
  c = aimAt(formField);
  if (document.elementFromPoint(c.x, c.y) === formField) {
    let prevented = false;
    const spy = e => { prevented = e.defaultPrevented; };
    addEventListener('keydown', spy);
    down('Enter');
    removeEventListener('keydown', spy);
    ok(!prevented, 'Enter over a text field must be left to the page, so forms submit');
  }
  formField.blur();
  formField.remove();

  // Space must still type a space while typing, rather than clicking something
  inp.focus();
  const beforeSpace = plainClicks;
  aimAt(plain);
  down(' ');
  ok(plainClicks === beforeSpace, 'Space while typing must type, not click');
  inp.blur();
  plain.remove();

  // An icon button: the hit lands on the SVG path inside it. element.click() does not
  // exist on SVG, so this used to throw and the keypress died — the reported "X won't
  // click". The click must still reach the button's own handler.
  const iconBtn = document.createElement('button');
  iconBtn.style.cssText = 'width:44px;height:44px;padding:0';
  iconBtn.innerHTML =
    '<svg width="44" height="44" viewBox="0 0 44 44"><path d="M10 10 L34 34 M34 10 L10 34" stroke="black" stroke-width="6"/></svg>';
  let iconClicks = 0;
  iconBtn.addEventListener('click', () => iconClicks++);
  spawn(iconBtn);
  c = aimAt(iconBtn);
  const hitInsideIcon = document.elementFromPoint(c.x, c.y);
  ok(hitInsideIcon && hitInsideIcon.tagName.toLowerCase() !== 'button',
     'setup: the hit must land on the SVG inside, not the button itself');
  ok(hitInsideIcon && typeof hitInsideIcon.click === 'undefined',
     'setup: SVG content really has no click() method — that was the bug');
  down('Enter');
  ok(iconClicks === 1, `an SVG icon button must click exactly once (got ${iconClicks})`);
  iconBtn.remove();

  // a link must still follow its href, since we no longer call the native click()
  const link = document.createElement('a');
  link.href = '#cursor-reached-it';
  link.textContent = 'link';
  link.style.cssText = 'width:80px;height:30px';
  spawn(link);
  location.hash = '';
  c = aimAt(link);
  if (document.elementFromPoint(c.x, c.y) === link) {
    down('Enter');
    ok(location.hash === '#cursor-reached-it', 'a link must still follow its href');
  }
  location.hash = '';
  link.remove();

  // a button inside a shadow root: elementFromPoint stops at the host, so we must drill
  const host = document.createElement('div');
  host.style.cssText = 'width:120px;height:40px';
  spawn(host);
  const shadow = host.attachShadow({ mode: 'open' });
  const inner = document.createElement('button');
  inner.textContent = 'inside shadow';
  inner.style.cssText = 'width:120px;height:40px';
  let innerClicks = 0;
  inner.addEventListener('click', () => innerClicks++);
  shadow.append(inner);
  c = aimAt(host);
  ok(kc.deepElementAt(c.x, c.y) === inner, 'the hit test must drill into a shadow root');
  down('Enter');
  ok(innerClicks === 1, 'a button inside a shadow root must be clickable');
  host.remove();

  // widgets that only listen for mousedown/mouseup must fire too
  const widget = document.createElement('div');
  widget.style.cssText = 'width:120px;height:40px';
  const seen = [];
  for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
    widget.addEventListener(type, () => seen.push(type));
  }
  spawn(widget);
  c = aimAt(widget);
  ok(document.elementFromPoint(c.x, c.y) === widget, 'setup: the widget must sit under the cursor');
  kc.activate();
  ok(seen.includes('mousedown') && seen.includes('mouseup'),
     `a full press must be sent, not click alone (got ${seen.join(',') || 'nothing'})`);
  ok(seen.includes('pointerdown') && seen.includes('pointerup'),
     'pointer events must fire too, or component libraries never see the press');
  ok(seen.includes('click'), 'the click itself must still arrive');
  ok(seen.filter(t => t === 'click').length === 1, 'exactly one click, never a double');
  ok(seen.join(',') === 'pointerdown,mousedown,pointerup,mouseup,click',
     `the order must match a real mouse (got ${seen.join(',')})`);
  widget.remove();

  // a text field under the cursor takes the caret, and must NOT be clicked away
  const field = document.createElement('input');
  field.style.cssText = 'width:120px;height:30px';
  let fieldClicks = 0;
  field.addEventListener('click', () => fieldClicks++);
  spawn(field);
  c = aimAt(field);
  if (document.elementFromPoint(c.x, c.y) === field) {
    kc.activate();
    ok(document.activeElement === field, 'a text field under the cursor must take focus');
    ok(fieldClicks === 0, 'a text field must get the caret, not a synthetic click');
    field.blur();
  }
  field.remove();

  // a held key must register, and let go must clear it
  down('ArrowRight');
  ok(kc.held.has('ArrowRight'), 'a held arrow must be recorded so the loop keeps moving');
  ok(kc.isMoving(), 'the animation loop must be running while a key is down');
  up('ArrowRight');
  ok(!kc.held.has('ArrowRight'), 'releasing must clear the key');
  ok(!kc.isMoving(), 'releasing the last key must stop the loop, not spin forever');

  // smooth motion: one keydown, then frames carry it along on their own
  kc.place(100, 300);
  kc.held.add('ArrowRight');
  kc.resetRun(1000);
  kc.step(1016);
  const f1 = xOf() - 100;
  ok(f1 > 0 && f1 < 40, `one 16 ms frame must glide a few px, not jump (got ${f1.toFixed(1)})`);
  const before = xOf();
  kc.step(1032);
  ok(xOf() > before, 'the next frame must carry on without another keypress');

  // accelerating: a frame late in the hold covers more ground than one at the start
  kc.place(0, 300);
  kc.resetRun(2000);
  kc.step(2016);
  const early = xOf();
  kc.step(2032);
  const earlyDelta = xOf() - early;
  kc.place(0, 300);
  kc.step(2600);
  const late = xOf();
  kc.step(2616);
  const lateDelta = xOf() - late;
  ok(lateDelta > earlyDelta,
     `holding must accelerate (early ${earlyDelta.toFixed(1)}px vs late ${lateDelta.toFixed(1)}px per frame)`);

  // a stalled tab must not teleport the cursor across the page
  kc.place(0, 300);
  kc.resetRun(3000);
  kc.step(9000); // six seconds later
  ok(xOf() < 200, 'a huge gap between frames must be capped, not turned into a leap');
  kc.held.clear();

  // typing guard
  aimAt(btn);
  inp.focus();
  const parked = xOf();
  down('ArrowRight');
  ok(!kc.held.has('ArrowRight'), 'arrows inside a text field must not drive the cursor');
  ok(xOf() === parked, 'the cursor must stay parked while typing');

  // ...but that must not trap you in the field with no mouse: Escape gets you out
  down('Escape');
  ok(!isTypingNow(), 'Escape must leave the text field');
  ok(!!document.getElementById(kc.CURSOR_ID), 'that first Escape must keep the cursor alive');
  down('ArrowRight');
  ok(kc.held.has('ArrowRight'), 'after leaving the field the arrows must work again');
  up('ArrowRight');

  down('Escape');
  ok(!document.getElementById(kc.CURSOR_ID), 'a second Escape must remove the cursor');

  // The ring must sit exactly where clicks land, even when body is a positioned,
  // offset ancestor — otherwise you aim at a link and hit whatever is 30 px away.
  const savedPos = document.body.style.position;
  const savedPad = document.body.style.padding;
  document.body.style.position = 'relative';
  document.body.style.padding = '37px 0 0 23px';
  kc.cursorOn();
  const ring = document.getElementById(kc.CURSOR_ID);
  kc.place(120, 90);
  kc.calibrate();
  const rect = ring.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const p = kc.posOf();
  ok(Math.abs(cx - p.x) <= 1 && Math.abs(cy - p.y) <= 1,
     `the ring must be drawn at the point it clicks (off by ${(cx - p.x).toFixed(1)}, ${(cy - p.y).toFixed(1)})`);
  kc.cursorOff();
  document.body.style.position = savedPos;
  document.body.style.padding = savedPad;

  btn.remove();
  inp.remove();

})();

// Reporting lives outside the interactive block: an early return in there once skipped
// the report entirely and left the page reading "running…" forever.
const note = noViewport
  ? '\n(skipped the interactive checks: this tab has a 0x0 viewport, so nothing is hittable)'
  : '';
out.textContent = fails.length
  ? 'FAIL\n' + fails.join('\n') + note
  : (noViewport ? 'PARTIAL — logic checks green' + note : 'PASS — all checks green');
out.style.color = fails.length ? 'crimson' : (noViewport ? 'darkorange' : 'green');
</script>
